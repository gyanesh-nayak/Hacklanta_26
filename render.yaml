services:
  - type: web
    name: musiggle-karaoke
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: pip install -r pitch_battle/requirements-render.txt
    startCommand: cd pitch_battle && uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false
